<html>
<head>
<style>
table {
    border-collapse: collapse;
    width: 50%;
}
th {
    background-color: #2E8B98;
    color: white;
    padding: 10px;
}
td {
    padding: 10px;
    text-align: center;
}
.row1 {
    background-color: #cfe2e8;
}
.row2 {
    background-color: white;
}
</style>
</head>
<body>
<table border="1">
<tr>
<th>S.N.</th>
<th>Name</th>
<th>Image</th>
</tr>
<script>
for (var i = 1; i <= 4; i++) {
    if (i % 2 == 1) {
        document.write("<tr class='row1'>");
    } else {
        document.write("<tr class='row2'>");
    }
    document.write("<td>" + i + "</td>");
    document.write("<td>Name " + i + "</td>");
    document.write("<td>" + i + ".jpg</td>");
    document.write("</tr>");
}
</script>
</table>
</body>
</html>
